name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager missing"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DJ-Dual-Deck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-Dual-Deck-APK
          path: DJ-Dual-Deck.apk
          if-no-files-found: error
      - name: Publish versioned Android preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          if [ -z "$VERSION" ]; then echo "Cannot read Android versionName"; exit 1; fi
          TAG="v${VERSION}-preview"
          TITLE="DJ Dual Deck ${VERSION} preview"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DJ-Dual-Deck.apk --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" DJ-Dual-Deck.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "Android ${VERSION} preview APK (debug-signed). Test build." --prerelease
          fi
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v1.0.0-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" DJ-Dual-Deck.apk --title "DJ Dual Deck ${GITHUB_REF_NAME}" --notes "Android preview APK" --generate-notes
