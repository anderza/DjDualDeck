/* UNIFIED SQUARE BUTTON SYSTEM — applies to every skin and viewport.
   Overrides older round play/CUE rules from individual skins. */
button, .shell-btn, .skins-trigger, .control, .control.primary,
.pill, .filebtn, .mixer-btn, .skin-card, .skin-close, .track-row,
.skin-item, .mini-btn { border-radius:2px!important; }
button::before, button::after { border-radius:2px; }
/* Playback keys have consistent square footprint without forcing overflow. */
.transport .control { flex:0 1 auto; width:min(18%,40px); min-width:0; aspect-ratio:1 / 1; min-height:0; padding:0; display:grid;place-items:center; }
.transport{justify-content:space-between}

body.theme-analog .control.primary, body.theme-cyber .control.primary,
body.theme-vinyl .control.primary, body.theme-minimal .control.primary{border-radius:2px!important}

/* VINTAGE TAPE DECK: real-looking mechanical buttons, with a tactile press. */
:root{--key-metal:#596778;--key-dark:#1d242d;--key-shine:#b3c1cc}
.control,.pill,.filebtn,.mixer-btn,.shell-btn,.skins-trigger,.skin-close,.mini-btn,.import-btn{
 position:relative;isolation:isolate;border:1px solid #0a0e14!important;
 background:linear-gradient(165deg,#83909b 0%,#66727c 12%,#3b4650 33%,#2c343e 70%,#222b34 100%)!important;

 transition:transform .09s ease,box-shadow .09s ease,filter .12s ease;
}
.control:active,.pill:active,.filebtn:active,.mixer-btn:active,.shell-btn:active,.skins-trigger:active,.skin-close:active,.import-btn:active{
 transform:translateY(2px);box-shadow:inset 0 2px 5px #000a,inset 0 0 1px #fff5,0 0 1px #000!important;filter:brightness(.88)
}
.control.primary,.control.on,.pill.on{

 background:linear-gradient(160deg,#576a45 0%,#445a32 15%,#2b3d27 70%,#1c3020 100%)!important;
 border:1px solid #101b14!important;
 text-shadow:0 0 5px var(--accent);
 box-shadow:inset 0 1px 0 #ecffd288,inset 0 -2px 2px #050a04a8,0 2px 0 #040605,0 0 7px var(--glow)!important
}

.eq-cell output{font:700 8px Consolas,monospace!important;color:var(--accent2)!important;width:31px!important;min-width:31px!important;text-align:right;white-space:nowrap}
.eq-slider{flex:1;min-width:0;display:flex;align-items:center;height:26px}

</style></head><body>
<div class="app">

</div></div></div><div class="toast" role="status" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const fmt=t=>!Number.isFinite(t)?'00:00':`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let audioCtx,output,recorder,parts=[],recording=false;const decks={};let cross=.5;let toastTimer;
function notify(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3500)}
function deckMarkup(id){return `<div class="deck-head"><div class="deck-name">DECK ${id} <span style="color:var(--accent)">●</span></div><div class="deck-head-actions">${id==='A'?'<button type="button" class="shell-btn skins-trigger" id="skinsBtn" aria-haspopup="dialog" aria-controls="skinDialog" aria-expanded="false">Скины</button>':''}<span class="status" id="status${id}">READY</span></div></div><div class="lcd"><div class="skin-visual" aria-hidden="true"><div class="skin-jog"><div class="skin-jog-core"></div></div><div class="skin-needle"></div><div class="skin-vu"><span></span><span></span></div><div class="skin-tape"><span></span><span></span></div><div class="skin-play-icon">▶</div></div><div class="lcd-top"><div style="min-width:0;flex:1"><div id="title${id}" class="track-title">NO TRACK LOADED</div><div id="subtitle${id}" class="track-sub">SELECT A FOLDER TO BEGIN</div></div><div class="label">${id} <span style="color:var(--accent)">■</span></div></div><div class="time-row"><span class="time" id="time${id}">00:00</span><span class="duration" id="duration${id}">/ 00:00</span></div><canvas class="viz" id="viz${id}" aria-label="Аудиоспектр"></canvas></div><input type="range" class="seek" id="seek${id}" min="0" max="1000" value="0" aria-label="Перемотка плеера ${id}"><div class="transport transport-all" role="group" aria-label="Воспроизведение и загрузка музыки"><button class="control" data-act="prev" title="Предыдущий трек" aria-label="Предыдущий трек">⏮</button><button class="control" data-act="stop" title="Стоп" aria-label="Стоп">■</button><button class="control primary" data-act="play" title="Играть/пауза" aria-label="Играть/пауза">▶</button><button class="control" data-act="next" title="Следующий трек" aria-label="Следующий трек">⏭</button><button class="control import-btn" data-act="files" title="Добавить аудиофайлы" aria-label="Добавить файлы">ФАЙЛ</button><button class="control import-btn" data-act="folder" title="Выбрать папку с музыкой" aria-label="Выбрать папку">ПАПКА</button><button class="control import-btn" data-act="m3u" title="Открыть плейлист M3U" aria-label="Открыть M3U-плейлист">M3U</button></div><div class="micro-actions"><button class="pill" data-act="cue" title="CUE: вернуться к сохранённой точке">CUE</button><button class="pill" data-act="setcue" title="Запомнить текущую позицию">SET CUE</button><button class="pill" data-act="loop" title="Повторять трек">LOOP OFF</button><button class="pill" data-act="autoplay" title="Автоматически включать следующий трек">AUTO ON</button></div><div class="vol-panel"><span class="vol-label">VOL ${id}</span><input aria-label="Громкость плеера ${id}" id="volume${id}" type="range" min="0" max="100" value="85"><span class="vol-value" id="volumeVal${id}">85%</span></div><div class="section-title">3-BAND EQ · LIVE AUDIO PROCESSING</div><div class="eq">${[['low','LOW'],['mid','MID'],['high','HIGH']].map(([k,v])=>`<div class="eq-cell"><label for="${k}${id}">${v}</label><div class="eq-slider"><input aria-label="${v} частоты плеера ${id}" id="${k}${id}" type="range" min="-12" max="12" step="1" value="0" title="${v}: 0 dB"></div><output id="${k}Val${id}">0</output></div>`).join('')}</div><div class="library"><div class="library-top"><span class="label">PLAYLIST <span id="count${id}">(0)</span></span><div class="library-actions"><button class="filebtn" data-act="clear" title="Очистить список треков" aria-label="Очистить плейлист">✕</button></div></div><div class="playlist" id="list${id}"><div class="empty">Пока нет аудиофайлов<br>Выберите папку, файлы или M3U-плейлист</div></div></div><div class="deck-foot"><span id="meta${id}">0 TRACKS</span><span>MP3 · WAV · FLAC* · OGG*</span></div><input class="hide" type="file" id="files${id}" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac" multiple><input class="hide" type="file" id="folder${id}" webkitdirectory directory multiple><input class="hide" type="file" id="m3u${id}" accept=".m3u,.m3u8,.txt"></input>`}
function initAudio(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();output=audioCtx.createMediaStreamDestination();for(const d of Object.values(decks)){const a=d.audio,src=audioCtx.createMediaElementSource(a),low=audioCtx.createBiquadFilter(),mid=audioCtx.createBiquadFilter(),high=audioCtx.createBiquadFilter(),an=audioCtx.createAnalyser(),gain=audioCtx.createGain();low.type='lowshelf';low.frequency.value=250;mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.75;high.type='highshelf';high.frequency.value=4000;an.fftSize=128;src.connect(low).connect(mid).connect(high).connect(an).connect(gain);gain.connect(audioCtx.destination);gain.connect(output);Object.assign(d,{low,mid,high,an,gain})}setMix();}
function setMix(){cross=Number($('#cross').value)/100;for(const id of ['A','B']){const d=decks[id];const c=id==='A'?Math.cos(cross*Math.PI/2):Math.sin(cross*Math.PI/2);if(d.gain)d.gain.gain.setTargetAtTime(c*d.volume, audioCtx.currentTime,.015)}$('#aMix').textContent=Math.round(Math.cos(cross*Math.PI/2)*100)+'%';$('#bMix').textContent=Math.round(Math.sin(cross*Math.PI/2)*100)+'%'}
function renderList(d){const el=$('#list'+d.id);$('#count'+d.id).textContent=`(${d.tracks.length})`;$('#meta'+d.id).textContent=d.tracks.length+' TRACKS';el.innerHTML=d.tracks.length?d.tracks.map((t,i)=>`<button class="track-row ${i===d.index?'selected':''}" data-index="${i}" title="Дважды нажмите для воспроизведения"><span>${(i+1).toString().padStart(2,'0')}</span><strong>${esc(t.name)}</strong><small>${i===d.index?'▶':'♫'}</small></button>`).join(''):'<div class="empty">Пока нет аудиофайлов<br>Выберите папку, файлы или M3U-плейлист</div>';el.querySelectorAll('[data-index]').forEach(btn=>{btn.addEventListener('click',()=>load(d,+btn.dataset.index,true));});}
function load(d,i,play=false){if(i<0||i>=d.tracks.length)return;d.audio.pause();d.index=i;d.audio.src=d.tracks[i].url;d.audio.load();d.cue=0;$('#title'+d.id).textContent=d.tracks[i].name;$('#subtitle'+d.id).textContent=d.tracks[i].path||'LOCAL AUDIO · READY';$('#time'+d.id).textContent='00:00';$('#seek'+d.id).value=0;renderList(d);if(play)toggle(d,true)}
async function toggle(d,force){if(!d.tracks.length){notify('Сначала добавьте музыку в DECK '+d.id);return}try{initAudio();await audioCtx.resume();if(force||d.audio.paused)await d.audio.play();else d.audio.pause()}catch(err){notify('Не удалось воспроизвести файл: '+err.message)}}
function addFiles(d,files){const allowed=/\.(mp3|wav|ogg|flac|m4a|aac|opus|webm)$/i;const audios=Array.from(files).filter(f=>f.type.startsWith('audio/')||allowed.test(f.name));if(!audios.length){notify('В выбранном месте не найдено аудиофайлов');return}for(const f of audios){const url=URL.createObjectURL(f);d.tracks.push({name:f.name.replace(/\.[^.]+$/,''),file:f,url,path:f.webkitRelativePath||f.name})}if(d.index===-1)load(d,0);else renderList(d);notify(`DECK ${d.id}: добавлено ${audios.length} треков`)}
async function m3u(d,file){if(!file)return;let txt=await file.text();let lines=txt.split(/\r?\n/);let names=lines.filter(s=>s.trim()&&!s.startsWith('#')).map(s=>decodeURIComponent(s.trim().replace(/\\/g,'/').split('/').pop()));let lookup=new Map(d.tracks.map((t,i)=>[t.file.name.toLowerCase(),i]));let ordered=[],miss=[];for(const n of names){let idx=lookup.get(n.toLowerCase());if(idx===undefined){miss.push(n);continue}ordered.push(d.tracks[idx])}if(ordered.length){const rest=d.tracks.filter(t=>!ordered.includes(t));d.tracks=[...ordered,...rest];d.index=-1;load(d,0);notify(`M3U: упорядочено ${ordered.length} треков${miss.length?`; не найдено: ${miss.length}`:''}`)}else notify('Сначала добавьте аудиофайлы из папки M3U: браузер не может читать файлы по путям плейлиста')}
function draw(d){const canvas=$('#viz'+d.id),ctx=canvas.getContext('2d');let w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.floor(w*devicePixelRatio)||canvas.height!==Math.floor(h*devicePixelRatio)){canvas.width=Math.floor(w*devicePixelRatio);canvas.height=Math.floor(h*devicePixelRatio)}ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,w,h);const bars=48,spacing=w/bars,arr=new Uint8Array(d.an?.frequencyBinCount||64);if(d.an)d.an.getByteFrequencyData(arr);const color=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.fillStyle=color;for(let i=0;i<bars;i++){let level=d.an?arr[Math.min(arr.length-1,Math.floor(i*arr.length/bars))]/255: .08+.035*Math.sin(i*.8);let height=Math.max(2,level*(h-2));ctx.globalAlpha=.5+level*.5;ctx.fillRect(i*spacing+1,h-height,Math.max(2,spacing-2),height)}ctx.globalAlpha=1}
function animation(){for(const d of Object.values(decks)){const cur=d.audio.currentTime,dur=d.audio.duration;$('#time'+d.id).textContent=fmt(cur);$('#duration'+d.id).textContent='/ '+fmt(dur);if(!d.seeking)$('#seek'+d.id).value=dur?Math.round(cur/dur*1000):0;const playing=!d.audio.paused;$('#status'+d.id).textContent=playing?'PLAYING':'READY';$('#status'+d.id).classList.toggle('playing',playing);d.el.querySelector('[data-act="play"]').textContent=playing?'Ⅱ':'▶';draw(d)}requestAnimationFrame(animation)}
for(const id of ['A','B']){const el=$('#deck'+id);el.innerHTML=deckMarkup(id);const audio=new Audio();audio.preload='metadata';const d={id,el,audio,tracks:[],index:-1,volume:.85,autoplay:true,loop:false,cue:0,seeking:false};decks[id]=d;audio.addEventListener('ended',()=>{if(d.loop){audio.currentTime=0;toggle(d,true)}else if(d.autoplay&&d.index<d.tracks.length-1)load(d,d.index+1,true)});audio.addEventListener('error',()=>{if(d.index>=0)notify(`DECK ${id}: браузер не поддерживает этот аудиофайл`)});el.addEventListener('click',ev=>{let b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='files'||a==='folder'||a==='m3u'){$('#'+a+id).click();return}if(a==='play'){toggle(d);return}if(a==='next'){if(d.tracks.length)load(d,Math.min(d.tracks.length-1,d.index+1),true);return}if(a==='prev'){if(audio.currentTime>3)audio.currentTime=0;else if(d.tracks.length)load(d,Math.max(0,d.index-1),true);return}if(a==='stop'){audio.pause();audio.currentTime=0;return}if(a==='setcue'){d.cue=audio.currentTime;notify(`DECK ${id}: CUE сохранён на ${fmt(d.cue)}`);return}if(a==='cue'){audio.currentTime=d.cue;return}if(a==='loop'){d.loop=!d.loop;b.classList.toggle('on',d.loop);b.textContent='LOOP '+(d.loop?'ON':'OFF');return}if(a==='autoplay'){d.autoplay=!d.autoplay;b.classList.toggle('on',!d.autoplay);b.textContent='AUTO '+(d.autoplay?'ON':'OFF');return}if(a==='clear'){audio.pause();d.tracks.forEach(t=>URL.revokeObjectURL(t.url));d.tracks=[];d.index=-1;audio.removeAttribute('src');audio.load();$('#title'+id).textContent='NO TRACK LOADED';$('#subtitle'+id).textContent='SELECT A FOLDER TO BEGIN';renderList(d)}});
for(const k of ['files','folder'])$('#'+k+id).addEventListener('change',e=>{addFiles(d,e.target.files);e.target.value=''});$('#m3u'+id).addEventListener('change',e=>{if(e.target.files[0])m3u(d,e.target.files[0]);e.target.value=''});const seek=$('#seek'+id);seek.addEventListener('pointerdown',()=>d.seeking=true);seek.addEventListener('pointerup',()=>d.seeking=false);seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration});$('#volume'+id).addEventListener('input',e=>{d.volume=e.target.value/100;$('#volumeVal'+id).textContent=e.target.value+'%';setMix()});for(const k of ['low','mid','high'])$('#'+k+id).addEventListener('input',e=>{const n=+e.target.value;$('#'+k+'Val'+id).textContent=(n>0?'+'+n:n)+' dB';e.target.title=k.toUpperCase()+': '+n+' dB';if(!audioCtx)initAudio();d[k].gain.value=n});}
$('#cross').addEventListener('input',setMix);$('#center').addEventListener('click',()=>{$('#cross').value=50;setMix()});
const themes=['neon','prodj','analog','cyber','vinyl','minimal','silver','studio'];
const names={classic:'Winamp Classic',neon:'Club Neon',prodj:'Pro DJ',analog:'Analog Studio',cyber:'Cyber Grid',vinyl:'Vinyl Classic Lite',minimal:'Minimal Dark'};
function applyTheme(name){if(!names[name])name='classic';document.body.classList.remove(...themes.map(t=>'theme-'+t));if(name!=='classic')document.body.classList.add('theme-'+name);try{localStorage.setItem('dj-theme',name)}catch(e){}document.querySelectorAll('.skin-card').forEach(btn=>{const chosen=btn.dataset.theme===name;btn.classList.toggle('active',chosen);btn.setAttribute('aria-pressed',chosen?'true':'false')});$('#skinsBtn').title='Текущий: '+names[name]}
const skinOverlay=$('#skinOverlay'),skinsBtn=$('#skinsBtn'),skinClose=$('#skinClose');let lastFocus=null;
function openSkins(){lastFocus=document.activeElement;skinOverlay.hidden=false;skinsBtn.setAttribute('aria-expanded','true');$('#skinDialog').scrollTop=0;skinClose.focus()}
function closeSkins(){skinOverlay.hidden=true;skinsBtn.setAttribute('aria-expanded','false');if(lastFocus?.focus)lastFocus.focus()}
skinsBtn.addEventListener('click',openSkins);skinClose.addEventListener('click',closeSkins);
skinOverlay.addEventListener('click',e=>{if(e.target===skinOverlay)closeSkins()});
document.querySelectorAll('.skin-card').forEach(btn=>btn.addEventListener('click',()=>{applyTheme(btn.dataset.theme);closeSkins()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!skinOverlay.hidden)closeSkins()});
let savedTheme='classic';try{savedTheme=localStorage.getItem('dj-theme')||'classic'}catch(e){}applyTheme(savedTheme);

$('#record').addEventListener('click',()=>{if(recording){recorder.stop();recording=false;$('#record').classList.remove('live');$('#record').textContent='● REC MIX';return}if(!window.MediaRecorder){notify('Браузер не поддерживает MediaRecorder');return}try{initAudio();parts=[];const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(output.stream,mt?{mimeType:mt}:undefined);recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onstop=()=>{const blob=new Blob(parts,{type:recorder.mimeType||'audio/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`DJ-DualDeck-mix-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.${blob.type.includes('mp4')?'m4a':'webm'}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Запись микса сохранена')};recorder.start();recording=true;$('#record').classList.add('live');$('#record').textContent='■ STOP REC';notify('Запись мастер-микса началась')}catch(err){notify('Не удалось включить запись: '+err.message)}});
setMix();animation();})();
</script></body></html>
